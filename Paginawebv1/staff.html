<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal Médico | VetWeb</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="imagenes/favicon.ico">
</head>

<body>

    <!-- header -->

    <header class="header">

        <div class="logo">
            <a href="index.html">
                <img src="imagenes/logofull.png" alt="Logo VetWeb">
            </a>
        </div>

        <nav class="nav">
            <a href="index.html#nosotros">Sobre Nosotros</a>
            <a href="index.html#servicios">Servicios</a>
            <a href="index.html#contacto">Contacto</a>
        </nav>

    </header>

    <!-- login medico -->

    <section class="staff-login">

        <div class="login-container">

            <h2>Portal Médico</h2>

            <form>

                <div class="mb-3">
                    <label for="staff-email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="staff-email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="staff-password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="staff-password" name="password" required>
                </div>

                <a href="dashboards/medico/perfil.html" class="btn btn-primary">
                    Iniciar Sesión
                </a>

            </form>

        </div>

    </section>

    <!-- footer -->

    <footer class="footer">

        <div class="footer-logo">
            <img src="imagenes/logofull.png" alt="Logo VetWeb">
        </div>

        <div class="footer-enlaces">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="index.html">Patient Portal</a>
            <a href="staff.html">Staff Login</a>
        </div>

        <div class="footer-copyright">
            <p>© 2026 VetWeb - Especialidad Veterinaria. All rights reserved.</p>
        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>

</html>
