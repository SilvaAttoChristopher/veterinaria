<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Mascota | VetWeb</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="icon" href="../../imagenes/favicon.ico">
</head>

<body>

    <div class="dashboard">

        <!-- sidebar -->

        <aside class="sidebar">

            <h1 class="logo-dashboard">VetWeb</h1>

            <div class="usuario-sidebar">

                <img src="../../imagenes/perfil.png" alt="Juan Martínez">

                <div>
                    <strong>Juan Martínez</strong>
                    <span>Cliente</span>
                </div>

            </div>

            <!-- menu -->

            <nav class="menu-dashboard">

                <a href="perfil.html">
                    <i class="bi bi-person-circle"></i>
                    Perfil
                </a>

                <a href="mascotas.html" class="activo">
                    <i class="bi bi-heart-fill"></i>
                    Mascotas
                </a>

                <a href="#">
                    <i class="bi bi-calendar3"></i>
                    Citas
                </a>

                <a href="#">
                    <i class="bi bi-bell"></i>
                    Notificaciones
                </a>

            </nav>

            <!-- sidebar footer -->

            <div class="sidebar-footer">

                <a href="#">
                    <i class="bi bi-gear"></i>
                    Ajustes
                </a>

                <a href="../../index.html" class="cerrar-sesion">
                    <i class="bi bi-box-arrow-right"></i>
                    Cerrar Sesión
                </a>

            </div>

        </aside>

        <!-- registro -->

        <main class="contenido-dashboard">

            <div class="cabecera-registro-mascota">

                <a href="mascotas.html" class="volver-directorio">
                    <i class="bi bi-arrow-left"></i>
                    Volver al directorio
                </a>

                <h2>Registrar Nueva Mascota</h2>

                <p>
                    Ingresa los datos clínicos iniciales para la creación del expediente veterinario.
                </p>

            </div>

            <section class="registro-mascota-card">

                <form>

                    <!-- informacion general -->

                    <div class="titulo-formulario-mascota">

                        <i class="bi bi-briefcase-medical"></i>

                        <h3>Información General</h3>

                    </div>

                    <div class="formulario-mascota-grid">

                        <div class="campo-registro-mascota">

                            <label for="nombre-mascota">
                                NOMBRE DE LA MASCOTA
                            </label>

                            <input type="text" id="nombre-mascota"
                                name="nombre-mascota"
                                placeholder="Ej. Max">

                        </div>

                        <div class="campo-registro-mascota">

                            <label for="especie">
                                ESPECIE
                            </label>

                            <select id="especie" name="especie">

                                <option selected disabled>
                                    Seleccione especie
                                </option>

                                <option>Canino</option>
                                <option>Felino</option>
                                <option>Ave</option>
                                <option>Otro</option>

                            </select>

                        </div>

                        <div class="campo-registro-mascota">

                            <label for="raza">
                                RAZA
                            </label>

                            <input type="text" id="raza"
                                name="raza"
                                placeholder="Ej. Golden Retriever">

                        </div>

                        <div class="campo-edad">

                            <div class="campo-registro-mascota">

                                <label for="edad">
                                    EDAD
                                </label>

                                <input type="number" id="edad"
                                    name="edad"
                                    min="0"
                                    value="0">

                            </div>

                            <div class="campo-registro-mascota">

                                <label>&nbsp;</label>

                                <select name="unidad-edad">
                                    <option>Años</option>
                                    <option>Meses</option>
                                </select>

                            </div>

                        </div>

                        <div class="campo-registro-mascota">

                            <label for="peso">
                                PESO (KG)
                            </label>

                            <input type="number" id="peso"
                                name="peso"
                                min="0"
                                step="0.1"
                                placeholder="0.0">

                        </div>

                    </div>

                    <div class="separador"></div>

                    <!-- evaluacion -->

                    <div class="titulo-formulario-mascota">

                        <i class="bi bi-clipboard2-pulse"></i>

                        <h3>Evaluación Inicial</h3>

                    </div>

                    <div class="campo-registro-mascota campo-observaciones">

                        <label for="observaciones">
                            OBSERVACIONES MÉDICAS INICIALES
                        </label>

                        <textarea id="observaciones"
                            name="observaciones"
                            placeholder="Describa el motivo de consulta, síntomas o antecedentes relevantes..."></textarea>

                    </div>

                    <!-- botones -->

                    <div class="acciones-registro-mascota">

                        <a href="mascotas.html" class="btn-cancelar-registro">
                            Cancelar
                        </a>

                        <button type="button" class="btn-guardar-registro">
                            <i class="bi bi-floppy"></i>
                            Guardar Registro
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
