<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Perfil | VetWeb</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="icon" href="../../imagenes/favicon.ico">
</head>

<body>

    <div class="dashboard">

        <!-- sidebar -->

        <aside class="sidebar">

            <a href="../../index.html" class="logo-dashboard">VetWeb</a>
            <div class="usuario-sidebar">

                <img src="../../imagenes/perfil.png" alt="Juan Martínez">

                <div>
                    <strong>Juan Martínez</strong>
                    <span>Cliente</span>
                </div>

            </div>

            <!-- menu -->

            <nav class="menu-dashboard">

                <a href="perfil.html" class="activo">
                    <i class="bi bi-person-circle"></i>
                    Perfil
                </a>

                <a href="mascotas.html">
                    <i class="bi bi-heart-fill"></i>
                    Mascotas
                </a>

                <a href="citas.html">
                    <i class="bi bi-calendar3"></i>
                    Citas
                </a>

                <a href="notificaciones.html">
                    <i class="bi bi-bell"></i>
                    Notificaciones
                </a>

            </nav>

            <!-- sidebar footer -->

            <div class="sidebar-footer">

                <a href="#">
                    <i class="bi bi-gear"></i>
                    Ajustes
                </a>

                <a href="../../index.html" class="cerrar-sesion">
                    <i class="bi bi-box-arrow-right"></i>
                    Cerrar Sesión
                </a>

            </div>

        </aside>

        <!-- editar perfil -->

        <main class="contenido-dashboard">

            <div class="titulo-configuracion">

                <h2>Configuración de Perfil</h2>

                <p>
                    Actualiza tu información personal y tus datos de contacto.
                </p>

            </div>

            <section class="editar-perfil-card">

                <form>

                    <!-- foto -->

                    <div class="editar-foto">

                        <div class="foto-perfil-editar">

                            <img src="../../imagenes/perfil.png" alt="Foto de perfil">

                            <span class="icono-editar-foto">
                                <i class="bi bi-pencil-fill"></i>
                            </span>

                        </div>

                        <div class="foto-informacion">

                            <strong>Foto de Perfil</strong>

                            <span>
                                JPG, GIF O PNG. MAX TAMAÑO DE 800K
                            </span>

                            <div class="botones-foto">

                                <button type="button" class="btn-subir">
                                    Subir Nueva
                                </button>

                                <button type="button" class="btn-eliminar">
                                    Eliminar
                                </button>

                            </div>

                        </div>

                    </div>

                    <div class="separador"></div>

                    <!-- informacion personal -->

                    <div class="formulario-editar-grid">

                        <div class="campo-editar">
                            <label for="nombres">NOMBRES</label>
                            <input type="text" id="nombres" name="nombres" value="Juan">
                        </div>

                        <div class="campo-editar">
                            <label for="apellidos">APELLIDOS</label>
                            <input type="text" id="apellidos" name="apellidos" value="Martínez">
                        </div>

                        <div class="campo-editar">
                            <label for="correo">CORREO ELECTRÓNICO</label>
                            <input type="email" id="correo" name="correo" value="jmartinez@vetweb.com">
                        </div>

                        <div class="campo-editar">
                            <label for="telefono">NÚMERO DE TELÉFONO</label>
                            <input type="tel" id="telefono" name="telefono" value="+51 900 123 456">
                        </div>

                        <div class="campo-editar">
                            <label for="dni">DNI</label>
                            <input type="text" id="dni" name="dni" value="74581236">
                        </div>

                        <div class="campo-editar">
                            <label for="direccion">DIRECCIÓN</label>
                            <input type="text" id="direccion" name="direccion"
                                value="Av. Venezuela 30, Lima">
                        </div>

                    </div>

                    <div class="separador"></div>

                    <!-- botones -->

                    <div class="acciones-editar">

                        <a href="perfil.html" class="btn-cancelar">
                            Cancelar
                        </a>

                        <a href="perfil.html" class="btn-guardar">
                            Guardar Cambios
                        </a>

                    </div>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
