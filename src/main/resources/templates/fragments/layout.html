<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">VETWEB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="icon" type="image/png" th:href="@{/imagenes/favicon.ico}">
</head>
<body>
    <!-- Header fragment -->
    <header class="header" th:fragment="header">
        <div class="logo">
            <a href="/">
                <img th:src="@{/imagenes/logofull.png}" alt="Logo CIRUVET">
            </a>
        </div>
        <nav class="nav">
            <a href="#nosotros">Sobre Nosotros</a>
            <a href="#servicios">Servicios</a>
            <a href="#contacto">Contacto</a>
        </nav>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#Login">
            Iniciar Sesión
        </button>
    </header>

    <!-- Login Modal -->
    <div class="modal fade" id="Login" tabindex="-1" aria-labelledby="LoginLabel" aria-hidden="true" th:fragment="loginModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5 fw-bold text-center w-100" id="LoginLabel">Iniciar Sesión</h1>
                    <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3 fw-bold">
                            <label for="login-email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="login-email" name="username" required>
                        </div>
                        <div class="mb-3 fw-bold">
                            <label for="login-password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="login-password" name="password" required>
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <a href="#Registro" data-bs-toggle="modal" data-bs-target="#Registro">No tiene una cuenta? Regístrese aquí</a>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="loginBtn">Iniciar Sesión</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="Registro" tabindex="-1" aria-labelledby="RegistroLabel" aria-hidden="true" th:fragment="registerModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5 fw-bold text-center w-100" id="RegistroLabel">Registrar cuenta</h1>
                    <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="row">
                            <div class="col-md-6 mb-3 fw-bold">
                                <label for="reg-nombres" class="form-label">Nombres</label>
                                <input type="text" class="form-control" id="reg-nombres" name="nombres" required>
                            </div>
                            <div class="col-md-6 mb-3 fw-bold">
                                <label for="reg-apellidos" class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="reg-apellidos" name="apellidos" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3 fw-bold">
                                <label for="reg-email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="reg-email" name="correo" required>
                            </div>
                            <div class="col-md-6 mb-3 fw-bold">
                                <label for="reg-password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="reg-password" name="password" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3 fw-bold">
                                <label for="reg-dni" class="form-label">DNI</label>
                                <input type="text" class="form-control" id="reg-dni" name="dni" required>
                            </div>
                            <div class="col-md-6 mb-3 fw-bold">
                                <label for="reg-telefono" class="form-label">Número de teléfono</label>
                                <input type="tel" class="form-control" id="reg-telefono" name="telefono">
                            </div>
                        </div>
                        <div class="mb-3 fw-bold">
                            <label for="reg-direccion" class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="reg-direccion" name="direccion">
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <a href="#Login" data-bs-toggle="modal" data-bs-target="#Login">¿Ya tiene una cuenta? Inicie sesión aquí</a>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="registerBtn">Registrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer fragment -->
    <footer class="footer" th:fragment="footer">
        <div class="footer-logo">
            <img th:src="@{/imagenes/logofull.png}" alt="Logo VETWEB">
        </div>
        <div class="footer-enlaces">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">Patient Portal</a>
            <a th:href="@{/staff}">Staff Login</a>
        </div>
        <div class="footer-copyright">
            <p>© 2026 VetWeb - Especialidad Veterinaria. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts fragment -->
    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/auth.js}"></script>
    </div>
</body>
</html>
