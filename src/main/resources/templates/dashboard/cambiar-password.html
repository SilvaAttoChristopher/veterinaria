<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/dashboard-layout :: head('Cambiar Contraseña | VetWeb')}">
    <title>Cambiar Contraseña | VetWeb</title>
</head>

<body>

    <div class="dashboard">

        <div th:replace="~{fragments/dashboard-layout :: sidebarCliente}"></div>

        <main class="contenido-dashboard">

            <div class="titulo-configuracion">

                <a th:href="@{/dashboard/perfil}" class="volver-directorio">
                    <i class="bi bi-arrow-left"></i>
                    Volver al perfil
                </a>

                <h2>Cambiar Contraseña</h2>

                <p>
                    Por seguridad, tu sesión se cerrará al cambiarla y
                    tendrás que iniciar sesión de nuevo.
                </p>

            </div>

            <section class="editar-perfil-card">

                <form id="formPassword" onsubmit="return false;">

                    <div class="titulo-formulario-mascota">
                        <i class="bi bi-shield-lock"></i>
                        <h3>Credenciales de Acceso</h3>
                    </div>

                    <div class="formulario-mascota-grid">

                        <div class="campo-registro-mascota campo-observaciones">
                            <label for="passwordActual">CONTRASEÑA ACTUAL</label>
                            <input type="password" id="passwordActual" required
                                autocomplete="current-password"
                                placeholder="••••••••">
                        </div>

                        <div class="separador"></div>

                        <div class="campo-registro-mascota campo-observaciones">
                            <label for="passwordNueva">NUEVA CONTRASEÑA</label>
                            <input type="password" id="passwordNueva" required minlength="8"
                                autocomplete="new-password"
                                placeholder="Mínimo 8 caracteres"
                                oninput="validarNueva()">
                            <div class="password-meter">
                                <div class="password-meter-barra">
                                    <span id="barraFuerza"></span>
                                </div>
                                <small id="textoFuerza">Use al menos 8 caracteres</small>
                            </div>
                        </div>

                        <div class="campo-registro-mascota campo-observaciones">
                            <label for="passwordConfirmacion">CONFIRMAR NUEVA CONTRASEÑA</label>
                            <input type="password" id="passwordConfirmacion" required minlength="8"
                                autocomplete="new-password"
                                placeholder="Repita la nueva contraseña"
                                oninput="validarNueva()">
                            <small id="mensajeCoincidencia" class="password-coincidencia"></small>
                        </div>

                    </div>

                    <div class="acciones-registro-mascota">

                        <a th:href="@{/dashboard/perfil}" class="btn-cancelar-registro">
                            Cancelar
                        </a>

                        <button type="button" class="btn-guardar-registro" id="btnGuardar"
                            onclick="cambiarPassword()" disabled>
                            <i class="bi bi-key"></i>
                            Actualizar Contraseña
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

    <div th:replace="~{fragments/dashboard-layout :: scripts}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('passwordActual').focus();
        });

        function fortaleza(pwd) {
            if (!pwd) return { puntos: 0, texto: 'Use al menos 8 caracteres', clase: '' };

            let puntos = 0;
            if (pwd.length >= 8) puntos++;
            if (pwd.length >= 12) puntos++;
            if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) puntos++;
            if (/\d/.test(pwd)) puntos++;
            if (/[^A-Za-z0-9]/.test(pwd)) puntos++;

            if (pwd.length < 8) return { puntos: 0, texto: 'Use al menos 8 caracteres', clase: '' };
            if (puntos <= 2) return { puntos: 33, texto: 'Contraseña débil', clase: 'debil' };
            if (puntos <= 4) return { puntos: 66, texto: 'Contraseña aceptable', clase: 'media' };
            return { puntos: 100, texto: 'Contraseña fuerte', clase: 'fuerte' };
        }

        function validarNueva() {
            const nueva = document.getElementById('passwordNueva').value;
            const confirmacion = document.getElementById('passwordConfirmacion').value;
            const actual = document.getElementById('passwordActual').value;

            const f = fortaleza(nueva);
            const barra = document.getElementById('barraFuerza');
            barra.style.width = f.puntos + '%';
            barra.className = f.clase;
            document.getElementById('textoFuerza').textContent = f.texto;

            const mensaje = document.getElementById('mensajeCoincidencia');
            if (confirmacion) {
                if (nueva === confirmacion) {
                    mensaje.textContent = 'Las contraseñas coinciden';
                    mensaje.className = 'password-coincidencia ok';
                } else {
                    mensaje.textContent = 'Las contraseñas no coinciden';
                    mensaje.className = 'password-coincidencia error';
                }
            } else {
                mensaje.textContent = '';
                mensaje.className = 'password-coincidencia';
            }

            const listo = actual.length > 0
                && nueva.length >= 8
                && nueva === confirmacion;

            document.getElementById('btnGuardar').disabled = !listo;
        }

        document.getElementById('passwordActual')
            .addEventListener('input', validarNueva);

        async function cambiarPassword() {
            const btn = document.getElementById('btnGuardar');
            const actual = document.getElementById('passwordActual').value;
            const nueva = document.getElementById('passwordNueva').value;
            const confirmacion = document.getElementById('passwordConfirmacion').value;

            if (nueva !== confirmacion) {
                alert('Las contraseñas nuevas no coinciden');
                return;
            }

            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        passwordActual: actual,
                        passwordNueva: nueva,
                        passwordConfirmacion: confirmacion
                    }),
                    credentials: 'same-origin'
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    alert(data.mensaje || 'Contraseña actualizada');
                    await Auth.logout();
                    return;
                }

                alert(data.mensaje || 'No se pudo actualizar la contraseña');
                btn.disabled = false;
            } catch (e) {
                alert('Error de conexión');
                btn.disabled = false;
            }
        }
    </script>

</body>

</html>
