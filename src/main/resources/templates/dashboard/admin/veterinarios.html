<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/dashboard-layout :: head('Veterinarios | VetWeb Admin')}">
    <title>Veterinarios | VetWeb Admin</title>
</head>

<body>

    <div class="dashboard">

        <div th:replace="~{fragments/dashboard-layout :: sidebarAdmin}"></div>

        <main class="contenido-dashboard">

            <div class="cabecera-busqueda-mascotas">
                <div>
                    <h2>Veterinarios</h2>
                    <p>Profesionales registrados y su especialidad.</p>
                </div>
            </div>

            <div class="busqueda-panel">
                <i class="bi bi-search"></i>
                <input type="text" id="buscador"
                    placeholder="Buscar por nombre o especialidad..."
                    oninput="filtrar()">
            </div>

            <section class="tabla-mascotas" id="tablaVets">
                <!-- Se carga dinámicamente -->
            </section>

        </main>

    </div>

    <div th:replace="~{fragments/dashboard-layout :: scripts}"></div>

    <script>
        let vets = [];

        document.addEventListener('DOMContentLoaded', cargar);

        async function cargar() {
            try {
                const res = await fetch('/api/usuarios?rol=VETERINARIO', {
                    credentials: 'same-origin'
                });
                if (!res.ok) return;
                vets = await res.json();
                filtrar();
            } catch (e) {
                console.error(e);
            }
        }

        function escapar(v) {
            if (v === null || v === undefined) return '';
            return String(v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function filtrar() {
            const q = document.getElementById('buscador').value.trim().toLowerCase();
            if (!q) {
                renderizar(vets);
                return;
            }
            renderizar(vets.filter(v =>
                (v.nombres || '').toLowerCase().includes(q) ||
                (v.apellidos || '').toLowerCase().includes(q) ||
                (v.especialidad || '').toLowerCase().includes(q)
            ));
        }

        async function conteoHorario(id) {
            try {
                const res = await fetch(`/api/horarios/veterinario/${id}`, {
                    credentials: 'same-origin'
                });
                if (!res.ok) return 0;
                const lista = await res.json();
                return lista.filter(h => h.activo).length;
            } catch (e) {
                return 0;
            }
        }

        async function renderizar(lista) {
            const cont = document.getElementById('tablaVets');

            if (lista.length === 0) {
                cont.innerHTML = '<p style="padding:24px;text-align:center;">No hay veterinarios registrados</p>';
                return;
            }

            const horarios = await Promise.all(lista.map(v => conteoHorario(v.idUsuario)));

            cont.innerHTML = `
                <div class="tabla-mascotas-header">
                    <span>VETERINARIO</span>
                    <span>ESPECIALIDAD</span>
                    <span>ESTADO</span>
                    <span class="accheader">ACCIONES</span>
                </div>
                ${lista.map((v, i) => `
                    <div class="fila-mascota">
                        <div class="nombre-mascota-tabla">
                            <div class="icono-mascota"><i class="bi bi-heart-pulse"></i></div>
                            <div>
                                <strong>${escapar(v.nombres)} ${escapar(v.apellidos)}</strong>
                                <span>${escapar(v.username)}</span>
                            </div>
                        </div>
                        <p>${escapar(v.especialidad || 'Sin especialidad')}</p>
                        <div>
                            <span class="estado-tabla ${v.estado === 'ACTIVO' ? 'estable' : 'urgente'}">
                                ${escapar(v.estado)} · ${horarios[i]} horario(s)
                            </span>
                        </div>
                        <div class="acciones-mascota">
                            <a href="/dashboard/admin/editar-usuario/${v.idUsuario}"
                               class="btn-tabla-principal">
                                Editar
                            </a>
                        </div>
                    </div>
                `).join('')}
            `;
        }
    </script>

</body>

</html>
