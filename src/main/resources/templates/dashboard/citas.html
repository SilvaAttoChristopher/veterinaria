<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/dashboard-layout :: head('Mis Citas | VetWeb')}">
    <title>Mis Citas | VetWeb</title>
</head>

<body>

    <div class="dashboard">

        <div th:replace="~{fragments/dashboard-layout :: sidebarCliente}"></div>

        <main class="contenido-dashboard">

            <div class="cabecera-citas">

                <div>
                    <h2>Mis Citas</h2>
                    <p>Consulta, agenda y administra tus citas veterinarias.</p>
                </div>

                <a th:href="@{/dashboard/registrar-cita}" class="btn-nueva-cita">
                    <i class="bi bi-plus-lg"></i>
                    Nueva Cita
                </a>

            </div>

            <!-- filtros -->

            <div class="filtros-citas">

                <div class="busqueda-citas">
                    <i class="bi bi-search"></i>
                    <input type="text" id="buscador"
                        placeholder="Buscar por mascota o motivo..."
                        oninput="filtrarCitas()">
                </div>

                <div class="busqueda-citas">
                    <i class="bi bi-funnel"></i>
                    <select id="filtroEstado" onchange="filtrarCitas()">
                        <option value="">Todos los estados</option>
                        <option value="PROGRAMADA">Programada</option>
                        <option value="ATENDIDA">Atendida</option>
                        <option value="CANCELADA">Cancelada</option>
                        <option value="NO_ASISTIO">No Asistió</option>
                    </select>
                </div>

            </div>

            <!-- tabla -->

            <section class="tabla-citas" id="tablaCitas">
                <!-- Se carga dinámicamente -->
            </section>

        </main>

    </div>

    <div th:replace="~{fragments/dashboard-layout :: scripts}"></div>

    <script>
        let citas = [];
        let usuarioActual = null;

        document.addEventListener('DOMContentLoaded', cargar);

        async function cargar() {
            const result = await Auth.getCurrentUser();
            if (!result.success) return;
            usuarioActual = result.data;
            await cargarCitas();
        }

        async function cargarCitas() {
            try {
                const res = await fetch(`/api/citas/cliente/${usuarioActual.id}`, {
                    credentials: 'same-origin'
                });
                if (!res.ok) return;
                citas = await res.json();
                filtrarCitas();
            } catch (e) {
                console.error(e);
            }
        }

        function escapar(valor) {
            if (valor === null || valor === undefined) return '';
            return String(valor)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        const ESTADOS = {
            'PROGRAMADA': { clase: 'pendiente', texto: 'Programada' },
            'ATENDIDA': { clase: 'atendida', texto: 'Atendida' },
            'CANCELADA': { clase: 'cancelada', texto: 'Cancelada' },
            'NO_ASISTIO': { clase: 'cancelada', texto: 'No Asistió' }
        };

        function filtrarCitas() {
            const q = document.getElementById('buscador').value.trim().toLowerCase();
            const estado = document.getElementById('filtroEstado').value;

            let lista = citas;

            if (estado) {
                lista = lista.filter(c => c.estado === estado);
            }

            if (q) {
                lista = lista.filter(c =>
                    (c.mascota?.nombre || '').toLowerCase().includes(q) ||
                    (c.motivo || '').toLowerCase().includes(q) ||
                    (c.servicio?.nombre || '').toLowerCase().includes(q)
                );
            }

            renderizar(lista);
        }

        function renderizar(lista) {
            const cont = document.getElementById('tablaCitas');

            if (lista.length === 0) {
                cont.innerHTML = '<p style="padding:24px;text-align:center;">No hay citas para mostrar</p>';
                return;
            }

            cont.innerHTML = `
                <div class="tabla-citas-header">
                    <span>MASCOTA / FECHA</span>
                    <span>SERVICIO</span>
                    <span>ESTADO</span>
                    <span>ACCIONES</span>
                </div>
                ${lista.map(c => {
                    const est = ESTADOS[c.estado] || { clase: 'pendiente', texto: c.estado };
                    return `
                        <div class="fila-cita">
                            <div class="nombre-cita-mascota">
                                <div class="icono-mascota">
                                    <i class="bi bi-paw-fill"></i>
                                </div>
                                <div>
                                    <strong>${escapar(c.mascota?.nombre || 'Mascota')}</strong>
                                    <span>${escapar(c.fecha)} · ${escapar((c.hora || '').slice(0, 5))}</span>
                                </div>
                            </div>
                            <p>${escapar(c.servicio?.nombre || '-')}</p>
                            <div>
                                <span class="estado-cita ${est.clase}">${est.texto}</span>
                            </div>
                            <div class="acciones-cita">
                                ${c.estado === 'PROGRAMADA' ? `
                                    <a href="/dashboard/editar-cita/${c.idCita}" class="btn-cita-secundario">
                                        Editar
                                    </a>
                                    <a href="#" class="btn-cita-cancelar"
                                        onclick="cancelarCita(${c.idCita}); return false;">
                                        Cancelar
                                    </a>
                                ` : `
                                    <a href="/dashboard/editar-cita/${c.idCita}" class="btn-cita-secundario">
                                        Ver
                                    </a>
                                `}
                            </div>
                        </div>
                    `;
                }).join('')}
            `;
        }

        async function cancelarCita(id) {
            if (!confirm('¿Estás seguro de cancelar esta cita?')) return;

            try {
                /* El PUT necesita la cita completa: se lee y sólo se cambia el estado. */
                const get = await fetch(`/api/citas/${id}`, { credentials: 'same-origin' });
                if (!get.ok) throw new Error('cita no encontrada');
                const cita = await get.json();

                const res = await fetch(`/api/citas/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mascota: { idMascota: cita.mascota?.idMascota },
                        veterinario: { idUsuario: cita.veterinario?.idUsuario },
                        servicio: { idServicio: cita.servicio?.idServicio },
                        fecha: cita.fecha,
                        hora: cita.hora,
                        motivo: cita.motivo,
                        estado: 'CANCELADA'
                    }),
                    credentials: 'same-origin'
                });

                if (res.ok) {
                    await cargarCitas();
                } else {
                    const err = await res.json().catch(() => ({}));
                    alert(err.mensaje || 'No se pudo cancelar la cita');
                }
            } catch (e) {
                alert('Error de conexión');
            }
        }
    </script>

</body>

</html>
