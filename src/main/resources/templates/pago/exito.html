<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/dashboard-layout :: head('Pago Exitoso | VetWeb')}">
    <title>Pago Exitoso | VetWeb</title>
</head>

<body>

    <div class="dashboard">

        <div th:replace="${rolActual == 'ADMIN'}
            ? ~{fragments/dashboard-layout :: sidebarAdmin}
            : (${rolActual == 'VETERINARIO'}
                ? ~{fragments/dashboard-layout :: sidebarVeterinario}
                : ~{fragments/dashboard-layout :: sidebarCliente})"></div>

        <main class="contenido-dashboard">

            <section class="registro-mascota-card"
                style="max-width:640px;margin:40px auto;text-align:center;padding:48px 32px;">

                <i class="bi"
                    th:classappend="${resultado.estado() == 'PAGADO'} ? 'bi-patch-check-fill' : 'bi-hourglass-split'"
                    th:style="${resultado.estado() == 'PAGADO'} ? 'font-size:72px;color:#198754;' : 'font-size:72px;color:#ffc107;'">
                </i>

                <h2 style="margin-top:16px;"
                    th:text="${resultado.estado() == 'PAGADO'} ? 'Pago realizado' : 'Pago en proceso'">
                    Pago realizado
                </h2>

                <p style="color:#666;margin-top:8px;" th:text="${resultado.mensaje()}">
                    Su pago fue procesado correctamente.
                </p>

                <div style="margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                    <a th:href="@{/dashboard/citas}" class="btn-nueva-cita">
                        <i class="bi bi-calendar-check"></i>
                        Ver mis citas
                    </a>
                    <a th:href="@{/dashboard}" class="btn-cita-secundario">
                        Ir al inicio
                    </a>
                </div>

            </section>

        </main>

    </div>

    <div th:replace="~{fragments/dashboard-layout :: scripts}"></div>

</body>

</html>
