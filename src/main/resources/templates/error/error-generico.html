<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aviso del Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow p-5 text-center" style="max-width: 500px; border-radius: 12px;">
    <h1 class="text-danger fw-bold mb-3" th:text="${codigo != null ? 'Error ' + codigo : 'Aviso'}">Aviso</h1>
    <p class="text-muted fs-5 mb-4" th:text="${mensaje != null ? mensaje : 'Acción no permitida o solicitud inválida.'}">
        Mensaje genérico, sin detalle interno.
    </p>
    <a th:href="@{/}" class="btn btn-primary fw-bold">Volver al inicio</a>
</div>

</body>
</html>
