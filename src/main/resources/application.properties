spring.application.name=veterinaria

# PostgreSQL
spring.datasource.url=${NEON_URL_DB:jdbc:postgresql://localhost:5432/veterinaria}
spring.datasource.username=${NEON_USER:postgres}
spring.datasource.password=${NEON_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
 
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
debug=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.uploads.fotos-perfil=uploads/fotos-perfil

# Stripe (pasarela de pagos) - se configuran por variables de entorno
stripe.api-key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.base-url=${STRIPE_BASE_URL:}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.port=8081