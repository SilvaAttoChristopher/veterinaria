<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VETWEB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" type="image/png" href="Imagenes/favicon.ico">
</head>

<body>

    <header class="header">

        <div class="logo">
            <a href="index.html">
                <img src="imagenes/logofull.png" alt="Logo CIRUVET">
            </a>
        </div>

        <nav class="nav">
            <a href="#nosotros">Sobre Nosotros</a>
            <a href="#servicios">Servicios</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <section class="staff-login">
        <div class="login-container">
            <h2>Portal médico</h2>
            <form action="staff_dashboard.html" method="post">
                <div class="mb-3">
                    <label for="staff-email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="staff-email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="staff-password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="staff-password" name="password" required>
                </div>
                <a href="pages/dashboard_perfilmedico.html" class="btn btn-primary">Iniciar Sesión</a>
            </form>
        </div>
    </section>

    <!-- ================= FOOTER ================= -->

    <footer class="footer">
        <div class="footer-logo">
            <img src="imagenes/logofull.png" alt="Logo VETWEB">
        </div>
        <div class="footer-enlaces">
            <a href="#"> Privacy Policy </a>
            <a href="#"> Terms of Service </a>
            <a href="#"> Patient Portal </a>
            <a href="#"> Staff Login </a>
        </div>
        <div class="footer-copyright">
            <p>
                © 2026 VetWeb - Especialidad Veterinaria. All rights reserved.
            </p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/auth.js"></script>
</body>

</html>
